<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        /* Background Image */
        .gradient-custom {
            background: url('/static/winter.png') no-repeat center center;
            background-size: cover;
            height: 100vh;
        }

        /* Transparent Login Box */
        .transparent-box {
            background-color: rgba(0, 0, 0, 0.7); /* Black with 70% opacity */
            border-radius: 1rem;
            padding: 2rem;
        }
    </style>
</head>
<body>

<section class="gradient-custom d-flex justify-content-center align-items-center">
    <div class="container">
        <div class="row d-flex justify-content-center">
            <div class="col-12 col-md-8 col-lg-5 col-xl-4">
                <div class="card transparent-box text-white">
                    <div class="card-body p-4 text-center">

                        <div class="mb-4 mt-3 pb-3">
                            <h2 class="fw-bold mb-2 text-uppercase">Login</h2>
                            <p class="text-white-50 mb-4">Please enter your Username and password!</p>
                                    <form method="POST">
    {{ form.hidden_tag() }}

    <div class="form-outline form-white mb-3">
        <label class="form-label" for="username">{{ form.username.label }}</label>
        {{ form.username(class="form-control", id="username") }}
    </div>

    <div class="form-outline form-white mb-3">
        <label class="form-label" for="password">{{ form.password.label }}</label>
        {{ form.password(class="form-control", id="password") }}
    </div>

    <button class="btn btn-primary btn-lg px-4" type="submit" >
        {{ form.submit.label }}
    </button>

        {% if result == "success" %}
    <script>
        window.location.href = "/welcome";
    </script>
{% elif result %}
    <div class="alert alert-danger mt-3" role="alert">
        {{ result }}
    </div>
{% endif %}
</form>
                            <div class="d-flex justify-content-center text-center mt-3">
                                <a href="#" class="text-white"><i class="fab fa-facebook-f fa-lg"></i></a>
                                <a href="#" class="text-white"><i class="fab fa-twitter fa-lg mx-3 px-2"></i></a>
                                <a href="#" class="text-white"><i class="fab fa-google fa-lg"></i></a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
