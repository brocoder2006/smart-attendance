<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Attendance System</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      position: relative;
    }

    .season-img {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: -1;
      opacity: 1;
    }

    .container {
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(8px);
      padding: 2rem;
      border-radius: 15px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      width: 680px;
      max-width: 95%;
    }

    h1 {
      color: white;
      margin-bottom: 1rem;
    }

    h2 {
      color: white;
      margin-bottom: 0.7rem;
      font-size: 1.3rem;
    }

    .period-options {
      display: flex;
      justify-content: center;
      gap: 2rem;
      margin-bottom: 1.5rem;
    }

    .form-check {
      font-size: 1.3rem;
      color: white;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .custom-radio {
      width: 20px;
      height: 20px;
      accent-color: #00bcd4;
      cursor: pointer;
    }

    button {
      background: #2193b0;
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 8px;
      font-size: 1.1em;
      cursor: pointer;
      transition: background 0.3s ease;
      width: 250px;
      margin-bottom: 1.5rem;
    }

    button:hover {
      background: #1a7a8f;
    }

    /* Video Feed Container */
    .video-container {
      position: relative;
      width: 480px;
      height: 360px;
      margin: 0 auto 1.5rem auto;
      border-radius: 12px;
      overflow: hidden;
      border: 3px solid #2193b0;
      background: #000;
      box-shadow: 0 0 15px rgba(33, 147, 176, 0.5);
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1); /* Mirror view */
    }

    .scanner-line {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 4px;
      background: linear-gradient(to right, transparent, #00bcd4, transparent);
      box-shadow: 0 0 8px #00bcd4;
      animation: scan 2.5s linear infinite;
      display: none;
      pointer-events: none;
    }

    @keyframes scan {
      0% { top: 0%; }
      50% { top: 100%; }
      100% { top: 0%; }
    }

    .attendance-box {
      margin-top: 1rem;
      padding: 1rem;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 10px;
      min-height: 60px;
      color: white;
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      justify-content: center;
      align-items: center;
    }

    .student-badge {
      background: #204c43;
      color: #fff;
      padding: 5px 12px;
      border-radius: 20px;
      font-weight: bold;
      border: 1px solid #ffd54f;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }
  </style>

  <script>
    let stream = null;
    let intervalId = null;

    async function startCamera() {
      const selected = document.querySelector('input[name="period"]:checked');
      if (!selected) {
        alert("⚠️ Please select the number of periods first!");
        return;
      }

      const period = selected.value;

      try {
        // Request browser webcam permission and start stream
        stream = await navigator.mediaDevices.getUserMedia({
          video: { width: 480, height: 360 }
        });
        
        const video = document.getElementById("webcam");
        video.srcObject = stream;
        video.style.display = "block";
        document.getElementById("scanner").style.display = "block";

        // Call backend start_camera to initialize list
        await fetch('/start_camera', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ period: period })
        });

        // Start sending frames to backend for recognition
        if (intervalId) clearInterval(intervalId);
        intervalId = setInterval(() => sendFrame(period), 1000);

        // Periodically poll final attendance data (every 3 seconds)
        setInterval(updateAttendanceList, 3000);

      } catch (error) {
        alert("❌ Camera access denied or error: " + error.message);
      }
    }

    function sendFrame(period) {
      const video = document.getElementById("webcam");
      const canvas = document.getElementById("canvas");
      const context = canvas.getContext("2d");

      if (video.srcObject) {
        context.drawImage(video, 0, 0, canvas.width, canvas.height);
        // Extract base64 JPEG image
        const dataURL = canvas.toDataURL("image/jpeg", 0.7);
        const base64Image = dataURL.split(",")[1];

        fetch('/process_frame', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ image: base64Image, period: period })
        })
        .then(response => response.json())
        .then(data => {
          if (data.names && data.names.length > 0) {
            updateAttendanceList();
          }
        })
        .catch(error => console.error("Error processing frame:", error));
      }
    }

    function updateAttendanceList() {
      fetch('/attendance_data')
        .then(response => response.json())
        .then(data => {
          const listDiv = document.getElementById("attendance-list");
          listDiv.innerHTML = "";
          
          if (data.names && data.names.length > 0) {
            data.names.forEach(name => {
              const badge = document.createElement("span");
              badge.className = "student-badge";
              badge.innerText = "🎓 " + name;
              listDiv.appendChild(badge);
            });
          } else {
            listDiv.innerText = "No attendees detected yet.";
          }
        })
        .catch(error => console.error("Error fetching attendance data:", error));
    }
  </script>
</head>
<body>
  <img src="static/winter.png" class="season-img" alt="Winter background">

  <div class="container">
    <h1>Attendance System</h1>

    <div class="video-container">
      <video id="webcam" autoplay playsinline style="display: none;"></video>
      <div class="scanner-line" id="scanner"></div>
    </div>
    
    <canvas id="canvas" width="480" height="360" style="display: none;"></canvas>

    <h2>Choose no. of periods:</h2>

    <div class="period-options">
      <div class="form-check">
        <input class="form-check-input custom-radio" type="radio" name="period" id="radio1" value="1">
        <label class="form-check-label" for="radio1">1</label>
      </div>
      <div class="form-check">
        <input class="form-check-input custom-radio" type="radio" name="period" id="radio2" value="2">
        <label class="form-check-label" for="radio2">2</label>
      </div>
    </div>

    <button onclick="startCamera()">Start Camera</button>

    <h2>Attendance Logged:</h2>
    <div class="attendance-box" id="attendance-list">No attendees detected yet.</div>

  </div>
</body>
</html>
