<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Semester Actions</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    /* Base Styles */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #f1f1f1;
    }

    /* Static Winter Background */
    .season-img {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: -1;
      opacity: 1;
    }

    .login-container {
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(5px);
      padding: 2.5rem;
      border-radius: 15px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
      width: 650px;
      max-width: 95%;
      margin: 0 auto;
    }

    h2 {
      text-align: center;
      color: white;
      margin-bottom: 2rem;
      font-size: 2em;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .action-grid {
      display: grid;
      gap: 1.5rem;
      margin: 2rem 0;
      grid-template-columns: repeat(2, minmax(250px, 1fr));
    }

    .action-card {
      background: rgba(255, 255, 255, 0.2); /* Same as login-container */
      backdrop-filter: blur(5px);
      border-radius: 15px;
      padding: 2rem;
      text-align: center;
      transition: all 0.3s ease;
      border: 2px solid transparent;
      min-height: 200px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
    }

    .action-card:hover {
      transform: translateY(-5px);
      border-color: #2193b0;
    }

    .action-icon {
      font-size: 3.5em;
      margin-bottom: 1.5rem;
    }

    a {
      text-decoration: none;
      color: #2193b0;
      font-weight: bold;
      font-size: 1.2rem;
    }

    p {
      font-size: 0.95rem;
      color: #555;
    }

    .action-buttons {
      display: flex;
      justify-content: space-between;
      margin-top: 2rem;
    }

    .secondary-button {
      background: #6c757d;
      color: white;
      padding: 12px 24px;
      border: none;
      border-radius: 8px;
      font-size: 1em;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    .secondary-button:hover {
      background: #5a6268;
    }

    @media (max-width: 768px) {
      .login-container {
        width: 90%;
      }
      .action-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <!-- Static Winter Background Image -->
  <img src="static/winter.png" class="season-img" alt="Winter background">

  <!-- Action Page Content -->
  <div class="login-container">
    <h2>Semester Actions</h2>
    <div class="action-grid">
      <div class="action-card"><a href="/display">
        <div class="action-icon">🗃️</div>
        <h3>View Records</h3></a>
      </div>
      <div class="action-card">
        <div class="action-icon">📩</div>
        <h3>
          <a href='/download' target="_blank">Download Records</a>
        </h3>
      </div>
    </div>
    <div class="action-buttons">
      <button class="btn btn-primary btn-custom" onclick="history.back()">Back</button>
      <button class="btn btn-primary btn-custom" onclick="window.location.href='/logout'">Logout</button>
    </div>
  </div>

</body>
</html>
